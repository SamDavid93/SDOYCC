name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [[ "${REPOSITORY_NAME,,}" == *.github.io ]]; then
            export VITE_BASE_PATH=/
          else
            export VITE_BASE_PATH="/$REPOSITORY_NAME/"
          fi
          node -e "const u=new URL(process.env.VITE_API_BASE_URL || ''); if(u.protocol!=='https:' || ['localhost','127.0.0.1','[::1]'].includes(u.hostname) || /YOUR_|REPLACE_|EXAMPLE\./i.test(u.href)) throw new Error('Set VITE_API_BASE_URL to the public HTTPS backend before deployment');"
          npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
